version: '2.3'

services:
  iceberg_rest:
    image: tabulario/iceberg-rest:latest
    expose:
      - ${ICEBERG_REST_PORT:-8181}
    environment:
      CATALOG_WAREHOUSE: s3://root/iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio1:${MINIO_PORT:-9001}
      CATALOG_S3_ACCESS__KEY__ID: minio
      CATALOG_S3_SECRET__ACCESS__KEY: minio123
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
